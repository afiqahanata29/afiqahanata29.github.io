
<head>
    <title>Beranda</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F1F5EC;
            color: #554B4E;
            line-height: 1.6;
        }

        table {
            border-radius: 12px;
            overflow: hidden;
            border-spacing: 0;
            box-shadow: 0 5px 18px rgba(100, 120, 90, 0.15);
        }

        h1 {
            color: #704C59;
            letter-spacing: 1px;
        }

        h3 {
            color: #B96F89;
        }

        a {
            color: #63835D;
            text-decoration: none;
        }

        a:hover {
            color: #C76F91;
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #E8D9DD;
        }

        tr:first-child td {
            background-color: #F5D5E0;
        }

        tr:nth-child(2) td {
            background-color: #D8E8CC;
        }

        tr:nth-child(3) td:last-child {
            background-color: #FBEAF0;
        }

        tr:last-child td {
            background-color: #A7C69A;
        }
    </style>
</head>
